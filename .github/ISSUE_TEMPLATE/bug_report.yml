name: Bug report
description: Report a problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Describe the bug
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Provide inputs, files, or commands to reproduce.
  - type: input
    attributes:
      label: OS / Python / Streamlit versions
